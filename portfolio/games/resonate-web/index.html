<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resonate</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      #canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        background: #000;
        object-fit: contain;
      }

      #status {
        position: absolute;
        inset: auto 16px 16px 16px;
        color: #f4f4f4;
        font: 600 14px/1.4 Arial, sans-serif;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      }

      #fullscreen {
        position: absolute;
        right: 12px;
        top: 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.52);
        color: #fff;
        cursor: pointer;
        font: 700 12px/1 Arial, sans-serif;
        padding: 9px 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <button id="fullscreen" type="button" aria-label="Fullscreen">Fullscreen</button>
    <div id="status">Loading...</div>

    <script>
      const canvas = document.getElementById('canvas');
      const statusElement = document.getElementById('status');
      const fullscreenButton = document.getElementById('fullscreen');
      const buildVersion = '20260519-0201';

      canvas.addEventListener('click', () => canvas.focus());
      fullscreenButton.addEventListener('click', () => canvas.requestFullscreen());

      var Module = {
        canvas: canvas,
        locateFile: (path, prefix) => {
          const filePath = `${prefix}${path}`;
          return path.endsWith('.data') || path.endsWith('.wasm') ? `${filePath}?v=${buildVersion}` : filePath;
        },
        print: (...args) => console.log(...args),
        printErr: (...args) => console.error(...args),
        setStatus: (text) => {
          statusElement.textContent = text || '';
          statusElement.style.display = text ? 'block' : 'none';
        },
        totalDependencies: 0,
        monitorRunDependencies: (left) => {
          Module.totalDependencies = Math.max(Module.totalDependencies, left);
          Module.setStatus(left ? `Preparing... (${Module.totalDependencies - left}/${Module.totalDependencies})` : '');
        },
      };

      window.onerror = () => {
        Module.setStatus('Failed to load. Please refresh the page.');
      };

      Module.setStatus('Downloading...');
    </script>
    <script>
      const gameScript = document.createElement('script');
      gameScript.async = true;
      gameScript.src = `index.js?v=${buildVersion}`;
      document.body.appendChild(gameScript);
    </script>
  </body>
</html>
