<body>


  <div class="floating-nav-container" id="navContainer">

    <button class="nav-trigger-btn" onclick="toggleNav()" aria-label="Open Menu">
      <div class="hamburger-lines">
        <span></span>
        <span></span>
      </div>
    </button>

    <nav class="nav-capsule-menu">
      <ul class="nav-links">
        <li><a href="../index.html" onclick="toggleNav()">Home</a></li>
        <li><a href="AboutMe.html" onclick="toggleNav()">About Me</a></li>
        <li><a href="Research.html" onclick="toggleNav()">Research</a></li>
        <li><a href="Projects.html" onclick="toggleNav()">Projects</a></li>
      </ul>

      <button class="nav-close-btn" onclick="toggleNav()" aria-label="Close Menu">
        <i data-lucide="x"></i>
      </button>
    </nav>

  </div>

  <script>
    function toggleNav() {
      const container = document.getElementById('navContainer');
      container.classList.toggle('active'); // active 클래스를 스위치처럼 껐다 켬
    }

    // 화면 빈 곳을 클릭하면 닫기
    document.addEventListener('click', (e) => {
      const container = document.getElementById('navContainer');
      if (container.classList.contains('active') && !container.contains(e.target)) {
        container.classList.remove('active');
      }
    });
  </script>
